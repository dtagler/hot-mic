<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HotMic preview</title>
<style>
  :root {
    --border-color: transparent;
  }
  html, body {
    margin: 0;
    padding: 0;
    background: #0e0e0e;
    color: #eaeaea;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scene {
    width: 1100px;
    text-align: center;
  }
  .laptop {
    position: relative;
    width: 100%;
    aspect-ratio: 16/10;
    background: linear-gradient(160deg, #1a1a1a 0%, #060606 100%);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6), 0 2px 0 rgba(255, 255, 255, 0.04) inset;
  }
  .screen {
    position: absolute;
    inset: 26px;
    background: #0a0e1c;
    border-radius: 18px;
    overflow: hidden;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(70, 110, 200, 0.35), transparent 45%),
      radial-gradient(circle at 82% 78%, rgba(190, 70, 150, 0.25), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(40, 50, 90, 0.4), transparent 70%);
  }
  /* Faint UI artifacts on the screen so it doesn't look empty */
  .screen::before {
    content: "";
    position: absolute;
    left: 60px;
    top: 60px;
    width: 240px;
    height: 14px;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 4px;
    box-shadow:
      0 32px 0 rgba(255, 255, 255, 0.05),
      0 60px 0 rgba(255, 255, 255, 0.04),
      0 88px 0 rgba(255, 255, 255, 0.04);
  }
  .screen::after {
    content: "";
    position: absolute;
    right: 60px;
    bottom: 60px;
    width: 160px;
    height: 100px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 12px;
  }
  .border-overlay {
    position: absolute;
    inset: 26px;
    border-radius: 18px;
    border: 5px solid var(--border-color);
    pointer-events: none;
  }
  .caption {
    margin-top: 28px;
    font-size: 18px;
    color: #888;
    letter-spacing: 0.02em;
  }
  .caption strong {
    color: #eaeaea;
    font-weight: 600;
  }
  .pill {
    display: inline-block;
    padding: 4px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    margin-right: 8px;
    vertical-align: 2px;
  }
  /* States */
  body.state-idle { --border-color: transparent; }
  body.state-cam { --border-color: #0080FF; }
  body.state-mic { --border-color: #DC0000; }
  body.state-both { --border-color: #9333EA; }

  .pill-idle { background: #2a2a2a; color: #999; }
  .pill-cam { background: #0080FF; color: white; }
  .pill-mic { background: #DC0000; color: white; }
  .pill-both { background: #9333EA; color: white; }
</style>
</head>
<body>
<div class="scene">
  <div class="laptop">
    <div class="screen"></div>
    <div class="border-overlay"></div>
  </div>
  <div class="caption" id="caption"></div>
</div>
<script>
  const state = (location.hash.slice(1) || 'idle');
  document.body.classList.add('state-' + state);

  const labels = {
    idle: { pill: 'idle', text: 'nothing in use' },
    cam: { pill: 'camera', text: 'camera in use' },
    mic: { pill: 'mic', text: 'microphone in use' },
    both: { pill: 'both', text: 'camera + microphone in use' },
  };
  const l = labels[state] || labels.idle;
  document.getElementById('caption').innerHTML =
    `<span class="pill pill-${state}">${l.pill}</span> <strong>${l.text}</strong>`;
</script>
</body>
</html>
